<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mokytojo lenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Caveat:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------- passcode gate ---------- -->
<div id="gate" class="center" hidden>
  <form id="gateForm" class="card">
    <h1>Mokytojo lenta</h1>
    <p id="gateError" class="msg" hidden></p>
    <label>Slaptažodis
      <input type="password" id="passcode" autocomplete="current-password" required>
    </label>
    <button class="btn" id="gateBtn">Prisijungti</button>
  </form>
</div>

<!-- ---------- dashboard ---------- -->
<div id="app" hidden>
  <nav class="tray">
    <div class="classes" id="classes"></div>
    <div class="tools" id="tools">
      <a class="tool" id="drive" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>Drive</a>
      <button class="tool dim" id="driveEdit" type="button" aria-label="Keisti Drive nuorodą">keisti</button>
      <button class="tool" id="wheelBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>Ratas</button>
      <button class="tool" id="displayBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h18v12H3zM9 20h6M12 16v4"/></svg>Ekranas</button>
      <a class="tool" href="../feedbackas/mokytojui.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/></svg>Atsiliepimai</a>
      <button class="tool dim" id="addStudents" type="button">+ mokiniai</button>
      <button class="tool dim" id="logout" type="button">Atsijungti</button>
    </div>
  </nav>

  <main class="board" id="board">
    <div class="zone praise" data-kind="praise">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M24 5l5.6 12.2 13.2 1.5-9.8 9 2.7 13L24 34l-11.7 6.7 2.7-13-9.8-9 13.2-1.5z"/></svg>
      <h2>Pagyrimas</h2>
    </div>

    <div class="magnets-area">
      <p id="error" class="msg" hidden></p>
      <div class="magnets" id="magnets"></div>
      <div class="away" id="away" hidden></div>
      <p class="hint" id="hint">Spausk magnetą: +1 taškas. Tempk į pagyrimą ar pastabą.</p>
    </div>

    <div class="notes">
      <h2>Pastaba</h2>
      <div class="zone" data-kind="note_sleep">
        <h2>Zzz</h2>
        <p>nedirba</p>
      </div>
      <div class="zone" data-kind="note_disrupt">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M7 20v8h7l17 9V11L14 20z"/><path d="M37 18c3 2 3 10 0 12M41 13c6 5 6 17 0 22"/></svg>
        <p>trukdo</p>
      </div>
    </div>
  </main>

  <main class="board" id="noClass" hidden>
    <div class="empty">
      <div>
        <p>Sukurk pirmą klasę</p>
        <button class="btn" type="button" id="firstClass">Nauja klasė</button>
      </div>
    </div>
  </main>
</div>

<!-- ---------- class / students dialog ---------- -->
<dialog id="classDialog">
  <form id="classForm" method="dialog">
    <h2 id="classTitle">Nauja klasė</h2>
    <p id="classError" class="msg" hidden></p>
    <div class="row" id="classMeta">
      <label>Pavadinimas
        <input type="text" id="className" maxlength="20" placeholder="8a" autocomplete="off">
      </label>
      <label>Klasė
        <select id="classGrade"></select>
      </label>
    </div>
    <label>Mokiniai, po vieną eilutėje
      <textarea id="classNames" placeholder="Vardenis Pavardenis" spellcheck="false"></textarea>
    </label>
    <div class="actions">
      <button class="btn quiet" type="button" id="classCancel">Atšaukti</button>
      <button class="btn" id="classSave">Išsaugoti</button>
    </div>
  </form>
</dialog>

<!-- ---------- display ---------- -->
<div class="full" id="display" hidden>
  <div class="bar"><button class="btn" type="button" id="displayClose">Uždaryti</button></div>
  <textarea class="display-text" id="displayText" maxlength="2000" spellcheck="false" placeholder="Užduotis…"></textarea>
</div>

<!-- ---------- wheel ---------- -->
<div class="full" id="wheel" hidden>
  <div class="bar">
    <button class="btn quiet" type="button" id="wheelClose">Uždaryti</button>
  </div>
  <div class="wheel-stage">
    <div class="wheel-box">
      <svg class="wheel" id="wheelSvg" viewBox="-100 -100 200 200"></svg>
      <div class="pointer"></div>
    </div>
    <div class="wheel-side">
      <div class="picked" id="picked" aria-live="polite"></div>
      <button class="btn" type="button" id="spin">Sukti</button>
      <p class="left" id="wheelLeft"></p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastUndo">Atšaukti</button></div>

<script src="api.js"></script>
<script>
(function () {
  var el = function (id) { return document.getElementById(id); };

  var TOKEN_KEY = "teacher.token";
  var CLASS_KEY = "teacher.class";
  var MAGNET_COLOURS = 6;

  var token = null;
  var classes = [];
  var current = null;          // teacher_class_state of the open class
  var away = {};               // class id -> Set of student ids off the board this visit
  var dialogMode = "create";

  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* ---------- errors ---------- */

  function fail(err) {
    if (err && err.code === "teacher_denied") return signOut();
    el("error").textContent = err.message;
    el("error").hidden = false;
  }
  function clearError() { el("error").hidden = true; }

  /* ---------- gate ---------- */

  var GATE_ERRORS = {
    denied: "Neteisingas slaptažodis.",
    locked: "Per daug bandymų. Palauk 15 minučių.",
    unset: "Slaptažodis dar nenustatytas.",
  };

  function signOut() {
    if (token) rpc("teacher_logout", { p_token: token }).catch(function () {});
    token = null;
    store(TOKEN_KEY, null);
    el("app").hidden = true;
    el("gate").hidden = false;
    el("passcode").focus();
  }

  el("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    el("gateBtn").disabled = true;
    rpc("teacher_login", { p_passcode: el("passcode").value }).then(function (res) {
      if (res.error) throw new Error(GATE_ERRORS[res.error] || GENERIC_ERROR);
      token = res.token;
      store(TOKEN_KEY, token);
      el("passcode").value = "";
      el("gateError").hidden = true;
      el("gate").hidden = true;
      return boot();
    }).catch(function (err) {
      el("gateError").textContent = err.message;
      el("gateError").hidden = false;
    }).then(function () { el("gateBtn").disabled = false; });
  });

  el("logout").addEventListener("click", signOut);

  /* ---------- classes ---------- */

  function boot() {
    el("app").hidden = false;
    return rpc("teacher_classes_list", { p_token: token }).then(function (list) {
      classes = list;
      var saved = load(CLASS_KEY);
      var pick = classes.find(function (c) { return c.id === saved; }) || classes[0];
      renderTabs();
      if (pick) return openClass(pick.id);
      showBoard(false);
    }).catch(fail);
  }

  function renderTabs() {
    var frag = document.createDocumentFragment();
    classes.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "class-tab";
      b.textContent = c.name;
      b.setAttribute("aria-current", String(!!current && current.id === c.id));
      b.addEventListener("click", function () { openClass(c.id); });
      frag.appendChild(b);
    });
    var add = document.createElement("button");
    add.type = "button";
    add.className = "class-tab add";
    add.textContent = "+ klasė";
    add.addEventListener("click", function () { openDialog("create"); });
    frag.appendChild(add);
    el("classes").replaceChildren(frag);
  }

  function showBoard(hasClass) {
    el("board").hidden = !hasClass;
    el("noClass").hidden = hasClass;
    el("tools").hidden = !hasClass;
  }

  function openClass(id) {
    return rpc("teacher_class_state", { p_token: token, p_class: id }).then(function (state) {
      current = state;
      store(CLASS_KEY, id);
      if (!away[id]) away[id] = new Set();
      clearError();
      showBoard(true);
      renderTabs();
      renderTools();
      renderMagnets();
    }).catch(fail);
  }

  function renderTools() {
    var a = el("drive");
    a.href = current.drive_url || "#";
    a.classList.toggle("dim", !current.drive_url);
  }

  el("drive").addEventListener("click", function (e) {
    if (!current.drive_url) { e.preventDefault(); editDrive(); }
  });
  el("driveEdit").addEventListener("click", editDrive);

  function editDrive() {
    var url = prompt("Klasės " + current.name + " Google Drive aplanko nuoroda:", current.drive_url || "https://drive.google.com/");
    if (url === null) return;
    url = url.trim();
    if (url === "https://drive.google.com/") url = "";
    rpc("teacher_set_drive", { p_token: token, p_class: current.id, p_url: url }).then(function () {
      current.drive_url = url || null;
      renderTools();
    }).catch(fail);
  }

  /* ---------- names ---------- */

  // First name; first name + last initial when two share a first name.
  function shortNames(students) {
    var first = function (s) { return s.full_name.split(" ")[0]; };
    var count = {};
    students.forEach(function (s) { var f = first(s).toLowerCase(); count[f] = (count[f] || 0) + 1; });
    var out = {};
    students.forEach(function (s) {
      var parts = s.full_name.split(" ");
      out[s.id] = count[first(s).toLowerCase()] > 1 && parts.length > 1
        ? parts[0] + " " + parts[parts.length - 1].charAt(0) + "."
        : parts[0];
    });
    return out;
  }

  function colourOf(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return h % MAGNET_COLOURS;
  }

  /* ---------- magnets ---------- */

  var names = {};

  function visibleStudents() {
    var gone = away[current.id];
    return current.students.filter(function (s) { return !gone.has(s.id); });
  }

  function renderMagnets() {
    names = shortNames(current.students);
    var frag = document.createDocumentFragment();
    visibleStudents().forEach(function (s) { frag.appendChild(magnet(s)); });
    el("magnets").replaceChildren(frag);
    el("hint").hidden = !current.students.length;
    renderAway();
    if (!current.students.length) {
      var b = document.createElement("button");
      b.className = "btn";
      b.type = "button";
      b.textContent = "Pridėti mokinius";
      b.addEventListener("click", function () { openDialog("add"); });
      el("magnets").appendChild(b);
    }
  }

  function magnet(s) {
    var m = document.createElement("div");
    m.className = "magnet c" + colourOf(s.id);
    m.tabIndex = 0;
    m.dataset.id = s.id;
    m.setAttribute("role", "button");
    m.setAttribute("aria-label", s.full_name + ", taškų: " + s.points_today);
    m.appendChild(document.createTextNode(names[s.id]));

    if (s.points_today > 0) {
      var p = document.createElement("span");
      p.className = "pts";
      p.textContent = s.points_today;
      m.appendChild(p);
    }

    var x = document.createElement("button");
    x.type = "button";
    x.className = "hide";
    x.textContent = "×";
    x.setAttribute("aria-label", "Šiandien nedalyvauja");
    x.addEventListener("click", function () { setAway(s, true); });
    m.appendChild(x);

    m.addEventListener("pointerdown", function (e) { grab(e, s, m); });
    m.addEventListener("keydown", function (e) {
      if (e.target !== m) return;
      var kind = { Enter: "point", " ": "point", p: "praise", m: "note_sleep", t: "note_disrupt" }[e.key];
      if (kind) { e.preventDefault(); log(s, kind); }
      if (e.key === "Delete") setAway(s, true);
    });
    return m;
  }

  function setAway(s, isAway) {
    away[current.id][isAway ? "add" : "delete"](s.id);
    renderMagnets();
  }

  function renderAway() {
    var gone = current.students.filter(function (s) { return away[current.id].has(s.id); });
    el("away").hidden = !gone.length;
    var frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode("Nedalyvauja:"));
    gone.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = names[s.id];
      b.title = "Grąžinti į lentą";
      b.addEventListener("click", function () { setAway(s, false); });
      frag.appendChild(b);
    });
    el("away").replaceChildren(frag);
  }

  /* ---------- drag: a tap is a point, a drop on a zone is that zone ---------- */

  var drag = null;
  var DRAG_PX = 8;

  function grab(e, s, m) {
    if (e.button !== 0 || e.target.closest(".hide")) return;
    m.setPointerCapture(e.pointerId);
    drag = { s: s, m: m, x: e.clientX, y: e.clientY, ghost: null, zone: null };
  }

  function zoneAt(x, y) {
    var hit = document.elementFromPoint(x, y);
    return hit && hit.closest(".zone");
  }

  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < DRAG_PX) return;
      drag.ghost = drag.m.cloneNode(true);
      drag.ghost.classList.add("ghost");
      drag.ghost.style.width = drag.m.offsetWidth + "px";
      document.body.appendChild(drag.ghost);
      drag.m.classList.add("lifted");
    }
    drag.ghost.style.left = e.clientX + "px";
    drag.ghost.style.top = e.clientY + "px";
    var z = zoneAt(e.clientX, e.clientY);
    if (z !== drag.zone) {
      if (drag.zone) drag.zone.classList.remove("over");
      if (z) z.classList.add("over");
      drag.zone = z;
    }
  });

  function drop(commit) {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (d.zone) d.zone.classList.remove("over");
    if (d.ghost) { d.ghost.remove(); d.m.classList.remove("lifted"); }
    if (!commit) return;
    if (!d.ghost) log(d.s, "point");
    else if (d.zone) log(d.s, d.zone.dataset.kind);
  }

  document.addEventListener("pointerup", function () { drop(true); });
  document.addEventListener("pointercancel", function () { drop(false); });

  /* ---------- the log ---------- */

  // Praise and notes stay nameless on screen: the board may be projected.
  var TOAST_TEXT = {
    praise: "Pagyrimas įrašytas.",
    note_sleep: "Pastaba įrašyta: nedirba.",
    note_disrupt: "Pastaba įrašyta: trukdo.",
  };

  function log(s, kind) {
    var classId = current.id;
    if (kind === "point") bumpPoints(s, 1);
    rpc("teacher_event_add", { p_token: token, p_student: s.id, p_kind: kind }).then(function (eventId) {
      toast(kind === "point" ? names[s.id] + " +1" : TOAST_TEXT[kind], function () {
        return rpc("teacher_event_undo", { p_token: token, p_event: eventId }).then(function () {
          if (kind === "point" && current.id === classId) bumpPoints(s, -1);
        });
      });
    }).catch(function (err) {
      if (kind === "point" && current.id === classId) bumpPoints(s, -1);
      fail(err);
    });
  }

  function bumpPoints(s, delta) {
    s.points_today = Math.max(0, s.points_today + delta);
    var old = el("magnets").querySelector('[data-id="' + s.id + '"]');
    if (!old) return;
    var fresh = magnet(s);
    var focused = old === document.activeElement;
    old.replaceWith(fresh);
    if (focused) fresh.focus();
    if (delta > 0) fresh.classList.add("bump");
  }

  var toastTimer = null;
  var toastUndo = null;

  function toast(text, undo) {
    el("toastText").textContent = text;
    el("toastUndo").hidden = !undo;
    el("toastUndo").disabled = false;
    toastUndo = undo;
    el("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el("toast").hidden = true; }, 6000);
  }

  el("toastUndo").addEventListener("click", function () {
    if (!toastUndo) return;
    el("toastUndo").disabled = true;
    toastUndo().then(function () { toast("Atšaukta.", null); }).catch(fail);
    toastUndo = null;
  });

  /* ---------- class dialog ---------- */

  (function fillGrades() {
    for (var g = 1; g <= 12; g++) {
      var o = document.createElement("option");
      o.value = g;
      o.textContent = g;
      el("classGrade").appendChild(o);
    }
  })();

  function openDialog(mode) {
    dialogMode = mode;
    el("classTitle").textContent = mode === "create" ? "Nauja klasė" : "Mokiniai: " + current.name;
    el("classMeta").hidden = mode !== "create";
    el("className").value = "";
    el("classNames").value = "";
    el("classError").hidden = true;
    el("classDialog").showModal();
    (mode === "create" ? el("className") : el("classNames")).focus();
  }

  el("firstClass").addEventListener("click", function () { openDialog("create"); });
  el("addStudents").addEventListener("click", function () { openDialog("add"); });
  el("classCancel").addEventListener("click", function () { el("classDialog").close(); });

  el("classForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (dialogMode === "create" && !el("className").value.trim()) {
      el("classError").textContent = "Įrašyk klasės pavadinimą.";
      el("classError").hidden = false;
      return;
    }

    var namesText = el("classNames").value;
    var call = dialogMode === "create"
      ? rpc("teacher_class_create", {
          p_token: token,
          p_name: el("className").value,
          p_grade: Number(el("classGrade").value),
          p_names: namesText,
        })
      : rpc("teacher_students_add", { p_token: token, p_class: current.id, p_names: namesText })
          .then(function () { return current.id; });

    el("classSave").disabled = true;
    call.then(function (id) {
      el("classDialog").close();
      store(CLASS_KEY, id);
      return boot();
    }).catch(function (err) {
      if (err.code === "teacher_denied") { el("classDialog").close(); return signOut(); }
      el("classError").textContent = err.message;
      el("classError").hidden = false;
    }).then(function () { el("classSave").disabled = false; });
  });

  /* ---------- display ---------- */

  function fitDisplay() {
    var n = el("displayText").value.length;
    el("displayText").style.setProperty("--fs", Math.max(2.6, Math.min(8, 64 / Math.sqrt(n + 1))) + "vw");
  }

  el("displayBtn").addEventListener("click", function () {
    el("displayText").value = current.display_text;
    fitDisplay();
    el("display").hidden = false;
    el("displayText").focus();
  });

  el("displayText").addEventListener("input", fitDisplay);

  el("displayClose").addEventListener("click", function () {
    el("display").hidden = true;
    var text = el("displayText").value;
    if (text === current.display_text) return;
    var classState = current;
    rpc("teacher_set_display", { p_token: token, p_class: classState.id, p_text: text })
      .then(function () { classState.display_text = text; })
      .catch(fail);
  });

  /* ---------- wheel ---------- */

  var SVGNS = "http://www.w3.org/2000/svg";
  var WHEEL_FILLS = ["#2a5fc7", "#6a43b5", "#117c87", "#b2367a", "#45596b", "#a35612"];
  var pool = [];
  var turn = 0;

  // The pointer sits at 3 o'clock, so a name on a slice reads straight at it.
  function drawWheel() {
    var svg = el("wheelSvg");
    svg.replaceChildren();
    var n = pool.length;
    var step = 360 / Math.max(n, 1);
    pool.forEach(function (s, i) {
      var a0 = i * step * Math.PI / 180, a1 = (i + 1) * step * Math.PI / 180;
      var shape;
      if (n === 1) {
        shape = document.createElementNS(SVGNS, "circle");
        shape.setAttribute("r", 96);
      } else {
        shape = document.createElementNS(SVGNS, "path");
        shape.setAttribute("d", "M0 0L" + 96 * Math.cos(a0) + " " + 96 * Math.sin(a0) +
          "A96 96 0 " + (step > 180 ? 1 : 0) + " 1 " + 96 * Math.cos(a1) + " " + 96 * Math.sin(a1) + "Z");
      }
      shape.setAttribute("fill", WHEEL_FILLS[i % WHEEL_FILLS.length]);
      shape.setAttribute("stroke", "#f7f8f6");
      shape.setAttribute("stroke-width", "1");
      svg.appendChild(shape);

      var t = document.createElementNS(SVGNS, "text");
      t.textContent = names[s.id];
      t.setAttribute("transform", "rotate(" + (i + 0.5) * step + ") translate(88 0)");
      t.setAttribute("text-anchor", "end");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("fill", "#fff");
      t.setAttribute("font-weight", "700");
      t.setAttribute("font-size", Math.min(11, Math.max(5, step * 0.45)));
      svg.appendChild(t);
    });
    var hub = document.createElementNS(SVGNS, "circle");
    hub.setAttribute("r", 8);
    hub.setAttribute("fill", "#f7f8f6");
    hub.setAttribute("stroke", "#22272b");
    hub.setAttribute("stroke-width", "2");
    svg.appendChild(hub);
    el("wheelLeft").textContent = n ? "Liko: " + n : "Visi išsukti.";
    el("spin").disabled = !n;
  }

  el("wheelBtn").addEventListener("click", function () {
    pool = visibleStudents().slice();
    turn = 0;
    var svg = el("wheelSvg");
    svg.style.transition = "none";
    svg.style.transform = "rotate(0deg)";
    el("picked").textContent = "";
    delete el("picked").dataset.next;
    el("spin").textContent = "Sukti";
    drawWheel();
    el("wheel").hidden = false;
    svg.getBoundingClientRect();
    svg.style.transition = "";
    el("spin").focus();
  });

  el("wheelClose").addEventListener("click", function () { el("wheel").hidden = true; });

  el("spin").addEventListener("click", function () {
    if (!pool.length) return;
    var svg = el("wheelSvg");
    var spinning = el("picked").dataset.next;
    // A name picked last spin leaves the wheel before the next one.
    if (spinning) {
      pool = pool.filter(function (s) { return s.id !== spinning; });
      delete el("picked").dataset.next;
      svg.style.transition = "none";
      turn = 0;
      svg.style.transform = "rotate(0deg)";
      drawWheel();
      svg.getBoundingClientRect();
      svg.style.transition = "";
      if (!pool.length) { el("picked").textContent = ""; return; }
    }

    var i = Math.floor(Math.random() * pool.length);
    var step = 360 / pool.length;
    var jitter = (Math.random() - 0.5) * step * 0.6;
    var target = -((i + 0.5) * step + jitter);
    turn = turn + 360 * 5 + (((target - turn) % 360) + 360) % 360;
    el("picked").textContent = "";
    el("spin").disabled = true;
    svg.style.transform = "rotate(" + turn + "deg)";

    var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(function () {
      el("picked").textContent = names[pool[i].id];
      el("picked").dataset.next = pool[i].id;
      el("wheelLeft").textContent = pool.length > 1 ? "Liko: " + (pool.length - 1) : "Visi išsukti.";
      el("spin").disabled = pool.length <= 1;
      el("spin").textContent = "Sukti dar";
    }, reduced ? 0 : 4300);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!el("display").hidden) el("displayClose").click();
    else if (!el("wheel").hidden) el("wheelClose").click();
  });

  /* ---------- boot ---------- */

  token = load(TOKEN_KEY);
  if (token) boot();
  else { el("gate").hidden = false; el("passcode").focus(); }
})();
</script>
</body>
</html>
