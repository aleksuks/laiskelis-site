<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mokytojo lenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Caveat:wght@700&display=swap">
<link rel="stylesheet" href="style.css?v=202610150711">
<link rel="stylesheet" href="art.css?v=202610150711">
</head>
<body>

<!-- ---------- passcode gate ---------- -->
<div id="gate" class="center" hidden>
  <form id="gateForm" class="card">
    <img class="hero" src="art/hero-teacher-login.png" alt="">
    <h1>Mokytojo lenta</h1>
    <p id="gateError" class="msg" hidden></p>
    <label>Slaptažodis
      <input type="password" id="passcode" autocomplete="current-password" required>
    </label>
    <button class="btn" id="gateBtn">Prisijungti</button>
  </form>
</div>

<!-- ---------- dashboard ---------- -->
<div id="app" hidden>
  <nav class="tray">
    <div class="classes" id="classes"></div>
    <div class="tools" id="tools">
      <a class="tool" id="drive" target="_blank" rel="noopener"><img src="art/tool-drive.png" alt="">Drive</a>
      <button class="tool" id="wheelBtn" type="button"><img src="art/tool-wheel.png" alt="">Ratas</button>
      <button class="tool" id="displayBtn" type="button"><img src="art/tool-display.png" alt="">Ekranas</button>
      <button class="tool" id="quizBtn" type="button"><img src="art/tool-quiz.png" alt="">Testas<span class="live-dot" id="liveDot" hidden></span></button>
      <a class="tool" href="../feedbackas/mokytojui.html" target="_blank" rel="noopener"><img src="art/tool-feedback.png" alt="">Atsiliepimai</a>
    </div>
    <div class="tools minor" id="toolsMinor">
      <button class="tool small" id="addStudents" type="button"><img src="art/tool-students.png" alt="">Mokiniai</button>
      <button class="tool small" id="lessonsBtn" type="button"><img src="art/eraser.png" alt="">Pamokos</button>
      <button class="tool small" id="pinsBtn" type="button"><img src="art/tool-pins.png" alt="">PIN</button>
      <button class="tool small" id="driveEdit" type="button" aria-label="Keisti Drive nuorodą"><img src="art/tool-class-add.png" alt="">Nuoroda</button>
      <button class="tool small" id="soundBtn" type="button"><img id="soundArt" src="art/tool-sound-on.png" alt=""><span id="soundLabel">Garsas</span></button>
      <button class="tool small" id="logout" type="button"><img src="art/tool-logout.png" alt="">Išeiti</button>
    </div>
    <button class="tray-toggle" id="trayToggle" type="button" aria-expanded="true" aria-label="Suskleisti meniu">▴</button>
  </nav>

  <main class="board" id="board">
    <div class="task-wrap">
      <textarea class="task" id="task" rows="1" maxlength="2000" spellcheck="false" placeholder="Užduotis…" aria-label="Užduotis"></textarea>
      <div class="task-size" role="group" aria-label="Šrifto dydis">
        <button type="button" id="taskSmaller" aria-label="Mažesnis šriftas">A−</button>
        <button type="button" id="taskAuto" aria-label="Automatinis dydis">A</button>
        <button type="button" id="taskBigger" aria-label="Didesnis šriftas">A+</button>
      </div>
    </div>

    <section class="mid zone" data-kind="neutral">
      <p id="error" class="msg" hidden></p>
      <div class="magnets" id="magnets"></div>
      <div class="away" id="away" hidden></div>
    </section>

    <!-- A magnet stays in the camp it was dropped on for the lesson. -->
    <div class="camps">
      <section class="camp good zone" data-kind="praise">
        <header><img class="emblem" src="art/emblem-praise.png" alt=""><h2>ЛУЧШИЙ</h2></header>
        <div class="magnets" id="campGood"></div>
      </section>
      <section class="camp bad zone" data-kind="note_sleep">
        <header><img class="emblem" src="art/emblem-sleep.png" alt=""><h2>Спят</h2></header>
        <div class="magnets" id="campSleep"></div>
      </section>
      <section class="camp bad zone" data-kind="note_disrupt">
        <header><img class="emblem" src="art/emblem-disrupt.png" alt=""><h2>Шумят</h2></header>
        <div class="magnets" id="campDisrupt"></div>
      </section>
    </div>
  </main>

  <main class="board" id="noClass" hidden>
    <div class="empty">
      <div>
        <img class="hero" src="art/hero-empty-class.png" alt="">
        <p>Sukurk pirmą klasę</p>
        <button class="btn" type="button" id="firstClass">Nauja klasė</button>
      </div>
    </div>
  </main>
</div>

<!-- ---------- class / students dialog ---------- -->
<dialog id="classDialog">
  <form id="classForm" method="dialog">
    <h2 id="classTitle">Nauja klasė</h2>
    <p id="classError" class="msg" hidden></p>
    <div class="row" id="classMeta">
      <label>Pavadinimas
        <input type="text" id="className" maxlength="20" placeholder="8a" autocomplete="off">
      </label>
      <label>Klasė
        <select id="classGrade"></select>
      </label>
    </div>
    <label>Mokiniai, po vieną eilutėje
      <textarea id="classNames" placeholder="Vardenis Pavardenis" spellcheck="false"></textarea>
    </label>
    <div class="actions">
      <button class="btn quiet" type="button" id="classCancel">Atšaukti</button>
      <button class="btn" id="classSave">Išsaugoti</button>
    </div>
  </form>
</dialog>

<!-- ---------- display ---------- -->
<div class="full" id="display" hidden>
  <div class="bar"><button class="btn" type="button" id="displayClose">Uždaryti</button></div>
  <textarea class="display-text" id="displayText" maxlength="2000" spellcheck="false" placeholder="Užduotis…"></textarea>
</div>

<!-- ---------- wheel ---------- -->
<div class="full" id="wheel" hidden>
  <div class="bar">
    <button class="btn quiet" type="button" id="wheelClose">Uždaryti</button>
  </div>
  <div class="wheel-stage">
    <div class="wheel-box">
      <svg class="wheel" id="wheelSvg" viewBox="-100 -100 200 200"></svg>
      <div class="pointer"></div>
    </div>
    <div class="wheel-side">
      <div class="picked" id="picked" aria-live="polite"></div>
      <button class="btn" type="button" id="spin">Sukti</button>
      <p class="left" id="wheelLeft"></p>
      <div class="wheel-names" id="wheelNames" aria-label="Kas sukasi ratu"></div>
    </div>
  </div>
</div>

<!-- ---------- quiz: pick one, then the live board (no scores on it) ---------- -->
<div class="full" id="quiz" hidden>
  <div class="bar">
    <h2 class="full-title" id="quizTitle"></h2>
    <button class="btn" type="button" id="quizStop" hidden>Baigti testą</button>
    <button class="btn quiet" type="button" id="quizCsv" hidden>CSV</button>
    <button class="btn quiet" type="button" id="quizNew" hidden>Kitas testas</button>
    <button class="btn quiet" type="button" id="quizClose">Uždaryti</button>
  </div>
  <p id="quizError" class="msg" hidden style="margin: 0 20px"></p>
  <div class="quiz-pick" id="quizPick"></div>
  <div class="quiz-board" id="quizBoard" hidden>
    <aside class="join">
      <img id="joinArt" src="../mokinys/qr.svg" alt="QR kodas: laiskelis.lt/mokinys">
      <p>laiskelis.lt/mokinys</p>
      <p class="joined" id="quizJoined"></p>
    </aside>
    <div class="runners" id="runners"></div>
  </div>
</div>

<!-- ---------- PINs: shown once, when issued ---------- -->
<div class="full" id="pins" hidden>
  <div class="bar">
    <h2 class="full-title" id="pinsTitle">PIN kodai</h2>
    <button class="btn" type="button" id="pinsIssue">Sukurti trūkstamus</button>
    <button class="btn quiet" type="button" id="pinsPrint">Spausdinti</button>
    <button class="btn quiet" type="button" id="pinsClose">Uždaryti</button>
  </div>
  <p class="pins-note">PIN matosi tik sukūrimo metu. Pamestą PIN pakeisk nauju. Mokiniai jungiasi laiskelis.lt/mokinys</p>
  <p id="pinsError" class="msg" hidden style="margin: 0 20px"></p>
  <div class="pin-list" id="pinList"></div>
</div>

<!-- ---------- lessons: start a new one, wipe this one, look back ---------- -->
<div class="full" id="lessons" hidden>
  <div class="bar">
    <h2 class="full-title" id="lessonsTitle">Pamokos</h2>
    <button class="btn" type="button" id="lessonNew">Nauja pamoka</button>
    <button class="btn quiet" type="button" id="lessonWipe">Ištrinti šią pamoką</button>
    <button class="btn quiet" type="button" id="lessonsClose">Uždaryti</button>
  </div>
  <p id="lessonsError" class="msg" hidden style="margin: 0 20px"></p>
  <div class="history" id="history"></div>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastUndo">Atšaukti</button></div>

<script src="api.js?v=202610150711"></script>
<script src="sound.js?v=202610150711"></script>
<script>
(function () {
  var el = function (id) { return document.getElementById(id); };

  var TOKEN_KEY = "teacher.token";
  var CLASS_KEY = "teacher.class";
  var MAGNET_COLOURS = 6;

  var token = null;
  var classes = [];
  var current = null;          // teacher_class_state of the open class
  var away = {};               // class id -> Set of student ids off the board this visit
  var dialogMode = "create";

  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* ---------- errors ---------- */

  function fail(err) {
    if (err && err.code === "teacher_denied") return signOut();
    el("error").textContent = err.message;
    el("error").hidden = false;
  }
  function clearError() { el("error").hidden = true; }

  /* ---------- gate ---------- */

  var GATE_ERRORS = {
    denied: "Neteisingas slaptažodis.",
    locked: "Per daug bandymų. Palauk 15 minučių.",
    unset: "Slaptažodis dar nenustatytas.",
  };

  function signOut() {
    if (token) rpc("teacher_logout", { p_token: token }).catch(function () {});
    token = null;
    store(TOKEN_KEY, null);
    el("app").hidden = true;
    el("gate").hidden = false;
    el("passcode").focus();
  }

  el("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    el("gateBtn").disabled = true;
    rpc("teacher_login", { p_passcode: el("passcode").value }).then(function (res) {
      if (res.error) throw new Error(GATE_ERRORS[res.error] || GENERIC_ERROR);
      token = res.token;
      store(TOKEN_KEY, token);
      el("passcode").value = "";
      el("gateError").hidden = true;
      el("gate").hidden = true;
      return boot();
    }).catch(function (err) {
      el("gateError").textContent = err.message;
      el("gateError").hidden = false;
    }).then(function () { el("gateBtn").disabled = false; });
  });

  el("logout").addEventListener("click", signOut);

  function renderSound() {
    var on = Sound.enabled();
    el("soundArt").src = "art/tool-sound-" + (on ? "on" : "off") + ".png";
    el("soundBtn").setAttribute("aria-pressed", String(on));
    el("soundLabel").textContent = on ? "Garsas" : "Tyliai";
  }
  el("soundBtn").addEventListener("click", function () { Sound.toggle(); renderSound(); Sound.pop(); });
  renderSound();

  /* ---------- classes ---------- */

  function boot() {
    el("app").hidden = false;
    return rpc("teacher_classes_list", { p_token: token }).then(function (list) {
      classes = list;
      var saved = load(CLASS_KEY);
      var pick = classes.find(function (c) { return c.id === saved; }) || classes[0];
      renderTabs();
      if (pick) return openClass(pick.id);
      showBoard(false);
    }).catch(fail);
  }

  function renderTabs() {
    var frag = document.createDocumentFragment();
    classes.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "class-tab";
      b.textContent = c.name;
      b.setAttribute("aria-current", String(!!current && current.id === c.id));
      b.addEventListener("click", function () { openClass(c.id); });
      frag.appendChild(b);
    });
    var add = document.createElement("button");
    add.type = "button";
    add.className = "class-tab add";
    add.textContent = "+ klasė";
    add.addEventListener("click", function () { openDialog("create"); });
    frag.appendChild(add);
    el("classes").replaceChildren(frag);
  }

  function showBoard(hasClass) {
    el("board").hidden = !hasClass;
    el("noClass").hidden = hasClass;
    el("tools").hidden = !hasClass;
    el("addStudents").hidden = el("pinsBtn").hidden = el("driveEdit").hidden = el("lessonsBtn").hidden = !hasClass;
  }

  /* ---------- the tray folds away to give the board the room ---------- */

  var TRAY_KEY = "teacher.trayMin";
  function setTray(min) {
    document.body.classList.toggle("tray-min", min);
    el("trayToggle").setAttribute("aria-expanded", String(!min));
    el("trayToggle").setAttribute("aria-label", min ? "Išskleisti meniu" : "Suskleisti meniu");
    store(TRAY_KEY, min ? "1" : null);
  }
  el("trayToggle").addEventListener("click", function () { setTray(!document.body.classList.contains("tray-min")); });
  setTray(load(TRAY_KEY) === "1");

  /* ---------- motion helpers ---------- */

  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
  function later(ms) { return new Promise(function (r) { setTimeout(r, REDUCED.matches ? 0 : ms); }); }

  // Switching class: the eraser wipes the board, then the next class's
  // magnets drop on. Resolves when the board is clean.
  var wipeEl = null;
  function wipe() {
    if (REDUCED.matches) return Promise.resolve();
    wipeEl = document.createElement("div");
    wipeEl.className = "wipe";
    var img = document.createElement("img");
    img.src = "art/eraser.png";
    img.alt = "";
    wipeEl.appendChild(img);
    el("board").appendChild(wipeEl);
    Sound.swish();
    return later(520);
  }
  function unwipe() {
    if (!wipeEl) return;
    var w = wipeEl;
    wipeEl = null;
    w.classList.add("out");
    setTimeout(function () { w.remove(); }, 200);
  }

  // The full screens roll down like a projector screen, and back up.
  function openFull(node) {
    node.classList.remove("closing");
    node.hidden = false;
    node.classList.add("open");
    Sound.roll();
  }
  function closeFull(node) {
    if (node.hidden) return;
    node.classList.remove("open");
    node.classList.add("closing");
    later(280).then(function () { node.hidden = true; node.classList.remove("closing"); });
  }

  function coinAt(node) {
    if (REDUCED.matches) return;
    var r = node.getBoundingClientRect();
    var c = document.createElement("i");
    c.className = "coin-fly";
    c.style.left = r.left + r.width / 2 + "px";
    c.style.top = r.top + 8 + "px";
    document.body.appendChild(c);
    setTimeout(function () { c.remove(); }, 950);
  }

  function stamp(zone) {
    zone.classList.remove("stamped");
    void zone.offsetWidth;
    zone.classList.add("stamped");
    setTimeout(function () { zone.classList.remove("stamped"); }, 600);
  }

  function confetti(anchor) {
    if (REDUCED.matches) return;
    var r = anchor.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 28; i++) {
      var c = document.createElement("i");
      c.className = "confetti";
      c.style.backgroundImage = "url(art/confetti-" + (i % 12) + ".png)";
      c.style.left = cx + "px";
      c.style.top = cy + "px";
      var a = Math.random() * Math.PI * 2, d = 140 + Math.random() * 280;
      c.style.setProperty("--dx", Math.cos(a) * d + "px");
      c.style.setProperty("--dy", Math.sin(a) * d * 0.7 + 160 + "px");
      c.style.setProperty("--rot", Math.random() * 900 - 450 + "deg");
      c.style.setProperty("--t", 1.1 + Math.random() * 0.9 + "s");
      document.body.appendChild(c);
      setTimeout(c.remove.bind(c), 2200);
    }
  }

  function openClass(id) {
    var switching = current && current.id !== id && !el("board").hidden;
    flushTask();
    return Promise.all([
      rpc("teacher_class_state", { p_token: token, p_class: id }),
      switching ? wipe() : null,
    ]).then(function (res) {
      current = res[0];
      store(CLASS_KEY, id);
      if (!away[id]) away[id] = new Set();
      clearError();
      showBoard(true);
      renderTabs();
      renderTools();
      renderLiveDot();
      el("task").value = current.display_text;
      sizeTask();
      renderMagnets(true);
      unwipe();
    }).catch(function (err) { unwipe(); fail(err); });
  }

  function renderTools() {
    var a = el("drive");
    a.href = current.drive_url || "#";
    a.classList.toggle("dim", !current.drive_url);
  }

  el("drive").addEventListener("click", function (e) {
    if (!current.drive_url) { e.preventDefault(); editDrive(); }
  });
  el("driveEdit").addEventListener("click", editDrive);

  function editDrive() {
    var url = prompt("Klasės " + current.name + " Google Drive aplanko nuoroda:", current.drive_url || "https://drive.google.com/");
    if (url === null) return;
    url = url.trim();
    if (url === "https://drive.google.com/") url = "";
    rpc("teacher_set_drive", { p_token: token, p_class: current.id, p_url: url }).then(function () {
      current.drive_url = url || null;
      renderTools();
    }).catch(fail);
  }

  /* ---------- names ---------- */

  // First name; first name + last initial when two share a first name.
  function shortNames(students) {
    var first = function (s) { return s.full_name.split(" ")[0]; };
    var count = {};
    students.forEach(function (s) { var f = first(s).toLowerCase(); count[f] = (count[f] || 0) + 1; });
    var out = {};
    students.forEach(function (s) {
      var parts = s.full_name.split(" ");
      out[s.id] = count[first(s).toLowerCase()] > 1 && parts.length > 1
        ? parts[0] + " " + parts[parts.length - 1].charAt(0) + "."
        : parts[0];
    });
    return out;
  }

  function colourOf(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return h % MAGNET_COLOURS;
  }

  /* ---------- magnets ---------- */

  var names = {};

  function visibleStudents() {
    var gone = away[current.id];
    return current.students.filter(function (s) { return !gone.has(s.id); });
  }

  // `arrived`: the one student whose magnet just landed in a camp.
  function renderMagnets(entering, arrived) {
    names = shortNames(current.students);
    var lists = { "": document.createDocumentFragment(), good: document.createDocumentFragment(), sleep: document.createDocumentFragment(), disrupt: document.createDocumentFragment() };
    visibleStudents().forEach(function (s, i) {
      var m = magnet(s);
      if (entering || s.id === arrived) {
        m.classList.add("enter");
        m.style.setProperty("--i", entering ? i : 0);
        m.addEventListener("animationend", function () { m.classList.remove("enter"); }, { once: true });
      }
      lists[s.camp || ""].appendChild(m);
    });
    el("magnets").replaceChildren(lists[""]);
    el("campGood").replaceChildren(lists.good);
    el("campSleep").replaceChildren(lists.sleep);
    el("campDisrupt").replaceChildren(lists.disrupt);
    renderAway();
    if (!current.students.length) {
      var b = document.createElement("button");
      b.className = "btn";
      b.type = "button";
      b.textContent = "Pridėti mokinius";
      b.addEventListener("click", function () { openDialog("add"); });
      el("magnets").appendChild(b);
    }
    fit();
  }

  function magnet(s) {
    var m = document.createElement("div");
    m.className = "magnet c" + colourOf(s.id);
    // Nobody sticks a magnet on perfectly straight.
    m.style.setProperty("--tilt", (colourOf(s.id + "~") * 0.6 - 1.5).toFixed(1) + "deg");
    m.tabIndex = 0;
    m.dataset.id = s.id;
    m.setAttribute("role", "button");
    m.setAttribute("aria-label", s.full_name + ", taškų: " + s.points_today);
    var nm = document.createElement("span");
    nm.className = "name";
    nm.textContent = names[s.id];
    m.appendChild(nm);
    // Long names get a smaller font, not a wider magnet.
    var len = names[s.id].length;
    if (len > 7) m.style.setProperty("--nf", Math.max(0.55, 7 / len).toFixed(2));

    // The yellow count is also the way to take a point back.
    if (s.points_today > 0) {
      var p = document.createElement("button");
      p.type = "button";
      p.className = "pts";
      p.textContent = s.points_today;
      p.title = "−1";
      p.setAttribute("aria-label", "Atimti tašką");
      p.addEventListener("click", function () { removePoint(s); });
      m.appendChild(p);
    }

    var x = document.createElement("button");
    x.type = "button";
    x.className = "hide";
    x.textContent = "×";
    x.setAttribute("aria-label", "Šiandien nedalyvauja");
    x.addEventListener("click", function () { setAway(s, true); });
    m.appendChild(x);

    m.addEventListener("pointerdown", function (e) { grab(e, s, m); });
    m.addEventListener("keydown", function (e) {
      if (e.target !== m) return;
      var kind = { Enter: "point", " ": "point", p: "praise", m: "note_sleep", t: "note_disrupt" }[e.key];
      if (kind) { e.preventDefault(); log(s, kind); }
      if (e.key === "-" || e.key === "Backspace") { e.preventDefault(); removePoint(s); }
      if (e.key === "n") moveCamp(s, null);
      if (e.key === "Delete") setAway(s, true);
    });
    return m;
  }

  function setAway(s, isAway) {
    away[current.id][isAway ? "add" : "delete"](s.id);
    renderMagnets();
  }

  function renderAway() {
    var gone = current.students.filter(function (s) { return away[current.id].has(s.id); });
    el("away").hidden = !gone.length;
    var frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode("Nedalyvauja:"));
    gone.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = names[s.id];
      b.title = "Grąžinti į lentą";
      b.addEventListener("click", function () { setAway(s, false); });
      frag.appendChild(b);
    });
    el("away").replaceChildren(frag);
  }

  /* ---------- fit: magnets shrink until every camp fits without scrolling ---------- */

  var NARROW = matchMedia("(max-width: 860px)");
  function fit() {
    var root = document.documentElement.style;
    if (NARROW.matches || el("board").hidden) { root.setProperty("--msr", "0.7"); sizeTask(); return; }
    // The neutral strip gets at most this share of the board; the task gets the rest.
    // Each camp on the right must hold its magnets without scrolling.
    var cap = el("board").clientHeight * STRIP_SHARE;
    var strip = el("board").querySelector(".mid");
    var camps = el("board").querySelectorAll(".camp");
    var fits = function () {
      if (strip.offsetHeight > cap) return false;
      for (var i = 0; i < camps.length; i++) if (camps[i].scrollHeight > camps[i].clientHeight + 1) return false;
      return true;
    };
    // ponytail: linear search, each step forces a layout; fine for a class of 30.
    // Big boards start bigger: 0.75 at a 1300 px wide board.
    var start = Math.min(1.05, Math.max(0.75, 0.75 * el("board").clientWidth / 1300));
    for (var ms = start; ms >= 0.35; ms -= 0.05) {
      root.setProperty("--msr", ms.toFixed(2));
      if (fits()) break;
    }
    sizeTask();
  }

  /* ---------- the task, written straight on the board ---------- */

  var taskTimer = null, taskSave = null;

  var taskFont = Number(load(FONT_KEY)) || 0;      // vw; 0 = fit to the box

  // Automatic: as big as the text allows without scrolling. A−/A+ pin a size.
  function sizeTask() {
    var t = el("task");
    if (taskFont) { t.style.fontSize = taskFont + "vw"; return; }
    for (var vw = 6; vw > 1.4; vw -= 0.2) {
      t.style.fontSize = vw.toFixed(1) + "vw";
      if (t.scrollHeight <= t.clientHeight + 1) return;
    }
  }

  function setTaskFont(vw) {
    taskFont = vw && Math.round(Math.min(10, Math.max(0.8, vw)) * 10) / 10;
    store(FONT_KEY, taskFont ? String(taskFont) : null);
    el("taskAuto").setAttribute("aria-pressed", String(!taskFont));

  var currentTaskVw = function () { return parseFloat(el("task").style.fontSize) || 3; };
  el("taskSmaller").addEventListener("click", function () { setTaskFont(currentTaskVw() / 1.15); });
  el("taskBigger").addEventListener("click", function () { setTaskFont(currentTaskVw() * 1.15); });
  el("taskAuto").addEventListener("click", function () { setTaskFont(0); });

  /* ---------- drag: a tap is a point, a drop on a camp moves the magnet there ---------- */

  var drag = null;
  var DRAG_PX = 8;

  function grab(e, s, m) {
    if (e.button !== 0 || e.target.closest(".hide, .pts")) return;
    m.setPointerCapture(e.pointerId);
    drag = { s: s, m: m, x: e.clientX, y: e.clientY, ghost: null, zone: null };
  }

  // The camp a magnet already lives in is not a target: it just goes home.
  function zoneAt(x, y, s) {
    var hit = document.elementFromPoint(x, y);
    var z = hit && hit.closest(".zone");
    if (!z) return null;
    var kind = z.dataset.kind;
    if (CAMP_OF[kind] === (s.camp || null)) return null;
    return z;
  }

  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < DRAG_PX) return;
      drag.ghost = drag.m.cloneNode(true);
      drag.ghost.classList.add("ghost");
      drag.ghost.style.width = drag.m.offsetWidth + "px";
      document.body.appendChild(drag.ghost);
      drag.m.classList.add("lifted");
    }
    drag.ghost.style.left = e.clientX + "px";
    drag.ghost.style.top = e.clientY + "px";
    var z = zoneAt(e.clientX, e.clientY, drag.s);
    if (z !== drag.zone) {
      if (drag.zone) drag.zone.classList.remove("over");
      if (z) z.classList.add("over");
      drag.zone = z;
    }
  });

  function drop(commit) {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (d.zone) d.zone.classList.remove("over");
    if (!d.ghost) {
      if (commit) log(d.s, "point");
      return;
    }
    // Dropped on a camp: the emblem stamps and the magnet lands there.
    // Anywhere else: it slides back home.
    var g = d.ghost;
    var kind = commit && d.zone ? d.zone.dataset.kind : null;
    if (!kind) {
      var r = d.m.getBoundingClientRect();
      g.classList.add("home");
      g.style.left = r.left + r.width / 2 + "px";
      g.style.top = r.top + r.height / 2 + "px";
      Sound.clack();
      later(300).then(function () { g.remove(); d.m.classList.remove("lifted"); });
      return;
    }
    g.remove();
    if (kind === "praise") Sound.chime(); else Sound.clack();
    if (kind === "neutral") moveCamp(d.s, null);
    else { stamp(d.zone); log(d.s, kind); }
  }

  document.addEventListener("pointerup", function () { drop(true); });
  document.addEventListener("pointercancel", function () { drop(false); });

  var CAMP_OF = { neutral: null, praise: "good", note_sleep: "sleep", note_disrupt: "disrupt" };

  function setCampLocal(s, camp, classId) {
    if (current.id !== classId) return;
    s.camp = camp;
    renderMagnets(false, s.id);

  // Moves without writing to the log (back to the middle).
  function moveCamp(s, camp) {
    var classId = current.id, prev = s.camp || null;

    setCampLocal(s, camp, classId);
    rpc("teacher_set_camp", { p_token: token, p_student: s.id, p_camp: camp })
      .catch(function (err) { setCampLocal(s, prev, classId); fail(err); });
  }

  function log(s, kind) {
    var classId = current.id, prev = s.camp || null;
    if (kind === "point") bumpPoints(s, 1);
    else setCampLocal(s, CAMP_OF[kind], classId);
    rpc("teacher_event_add", { p_token: token, p_student: s.id, p_kind: kind }).then(function (eventId) {
      toast(kind === "point" ? names[s.id] + " +1" : TOAST_TEXT[kind], function () {
        return rpc("teacher_event_undo", { p_token: token, p_event: eventId }).then(function () {
          if (kind === "point") { if (current.id === classId) bumpPoints(s, -1); return; }
          setCampLocal(s, prev, classId);
          return rpc("teacher_set_camp", { p_token: token, p_student: s.id, p_camp: prev });
        });
      });
    }).catch(function (err) {
      if (kind === "point") { if (current.id === classId) bumpPoints(s, -1); }

  function removePoint(s) {

    old.replaceWith(fresh);
    if (focused) fresh.focus();

  }

  /* ---------- wheel ---------- */

  var SVGNS = "http://www.w3.org/2000/svg";
  var WHEEL_FILLS = ["#2a5fc7", "#6a43b5", "#117c87", "#b2367a", "#45596b", "#a35612"];
  var pool = [];
  var turn = 0;
  var wheelOut = {};           // class id -> Set taken off the wheel this visit
  var picked = new Set();      // already drawn this opening
  var spinning = false;

  // A name picked last spin stays under the pointer until the wheel changes.
  function commitPick() {
    var id = el("picked").dataset.next;
    if (id) { picked.add(id); delete el("picked").dataset.next; }
  }

  function refreshWheel() {
    commitPick();
    var out = wheelOut[current.id];
    pool = visibleStudents().filter(function (s) { return !out.has(s.id) && !picked.has(s.id); });
    var svg = el("wheelSvg");
    svg.style.transition = "none";
    turn = 0;
    svg.style.transform = "rotate(0deg)";
    drawWheel();
    renderWheelNames();
    svg.getBoundingClientRect();
    svg.style.transition = "";
  }

  // Every name on the board: tap to take it off the wheel, tap again to put it back.
  function renderWheelNames() {
    var out = wheelOut[current.id];
    var frag = document.createDocumentFragment();
    visibleStudents().forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "wheel-name" + (out.has(s.id) ? " out" : picked.has(s.id) ? " done" : "");
      b.textContent = names[s.id];
      b.setAttribute("aria-pressed", String(!out.has(s.id) && !picked.has(s.id)));
      b.addEventListener("click", function () {
        if (spinning) return;
        if (out.has(s.id) || picked.has(s.id)) { out.delete(s.id); picked.delete(s.id); }
        else out.add(s.id);
        refreshWheel();
      });
      frag.appendChild(b);
    });
    el("wheelNames").replaceChildren(frag);
  }

  // The pointer sits at 3 o'clock, so a name on a slice reads straight at it.
  function drawWheel() {
    var svg = el("wheelSvg");
    svg.replaceChildren();
    var n = pool.length;
    var step = 360 / Math.max(n, 1);
    pool.forEach(function (s, i) {
      var a0 = i * step * Math.PI / 180, a1 = (i + 1) * step * Math.PI / 180;
      var shape;
      if (n === 1) {
        shape = document.createElementNS(SVGNS, "circle");
        shape.setAttribute("r", 96);
      } else {
        shape = document.createElementNS(SVGNS, "path");
        shape.setAttribute("d", "M0 0L" + 96 * Math.cos(a0) + " " + 96 * Math.sin(a0) +
          "A96 96 0 " + (step > 180 ? 1 : 0) + " 1 " + 96 * Math.cos(a1) + " " + 96 * Math.sin(a1) + "Z");
      }
      shape.setAttribute("fill", WHEEL_FILLS[i % WHEEL_FILLS.length]);
      shape.setAttribute("stroke", "#f7f8f6");
      shape.setAttribute("stroke-width", "1");
      svg.appendChild(shape);

      var t = document.createElementNS(SVGNS, "text");
      t.textContent = names[s.id];
      t.setAttribute("transform", "rotate(" + (i + 0.5) * step + ") translate(88 0)");
      t.setAttribute("text-anchor", "end");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("fill", "#fff");
      t.setAttribute("font-weight", "700");
      t.setAttribute("font-size", Math.min(11, Math.max(5, step * 0.45)));
      svg.appendChild(t);
    });
    var rim = document.createElementNS(SVGNS, "circle");
    rim.setAttribute("r", 96.5);
    rim.setAttribute("fill", "none");
    rim.setAttribute("stroke", "#22272b");
    rim.setAttribute("stroke-width", "3.5");
    svg.appendChild(rim);
    var hub = document.createElementNS(SVGNS, "circle");
    hub.setAttribute("r", 8);
    hub.setAttribute("fill", "#f7f8f6");
    hub.setAttribute("stroke", "#22272b");
    hub.setAttribute("stroke-width", "2");
    svg.appendChild(hub);
    el("wheelLeft").textContent = n ? "Liko: " + n : "Visi išsukti.";
    el("spin").disabled = !n;
  }

  el("wheelBtn").addEventListener("click", function () {
    if (!wheelOut[current.id]) wheelOut[current.id] = new Set();
    picked = new Set();
    el("picked").textContent = "";
    delete el("picked").dataset.next;

  el("wheelClose").addEventListener("click", function () { closeFull(el("wheel")); });

  el("spin").addEventListener("click", function () {
    if (el("picked").dataset.next) {
      refreshWheel();
      if (!pool.length) { el("picked").textContent = ""; return; }
    }
    if (!pool.length) return;
    var svg = el("wheelSvg");

    var i = Math.floor(Math.random() * pool.length);
    var step = 360 / pool.length;
    var jitter = (Math.random() - 0.5) * step * 0.6;
    var target = -((i + 0.5) * step + jitter);

    turn = turn + 360 * 5 + (((target - turn) % 360) + 360) % 360;

  }

  function renderBoard() {
    var n = board.n;
    var short = shortNames(quizClass.students);
    el("quizTitle").textContent = board.title + (board.live ? "" : ": baigta");
    el("quizStop").hidden = !board.live;
    el("quizCsv").hidden = el("quizNew").hidden = board.live;
    el("quizPick").hidden = true;
    el("quizBoard").hidden = false;
    el("quizJoined").textContent = "Prisijungė " + board.students.length + " iš " + quizClass.students.length;
    // Once it ends nobody needs the QR code: the finished pile takes its place.
    el("joinArt").src = board.live ? "../mokinys/qr.svg" : "art/hero-quiz-done.png";
    el("joinArt").alt = board.live ? "QR kodas: laiskelis.lt/mokinys" : "";
    el("quizBoard").classList.toggle("ended", !board.live);

    var rows = board.students.slice().sort(function (a, b) {
      return (short[a.id] || "").localeCompare(short[b.id] || "", "lt");
    });
    var frag = document.createDocumentFragment();
    rows.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "runner" + (r.answered >= n ? " done" : "");
      var name = document.createElement("span");
      name.className = "who";
      name.textContent = short[r.id] || "?";
      var track = document.createElement("span");
      track.className = "track";
      var fill = document.createElement("i");
      fill.style.width = (100 * r.answered / n) + "%";
      track.appendChild(fill);
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = r.answered + "/" + n;
      var speed = document.createElement("span");
      speed.className = "speed";
      speed.textContent = r.answered ? Math.round(r.avg_ms / 1000) + " s" : "";
      var mood = document.createElement("span");
      mood.className = "mood";
      if (MOOD_ART[r.mood]) {
        var face = document.createElement("i");
        face.className = "mood-face m" + MOOD_ART[r.mood];
        face.setAttribute("role", "img");
        face.setAttribute("aria-label", r.mood);
        mood.appendChild(face);
      }
      row.append(name, track, count, speed, mood);
      frag.appendChild(row);
    });
    el("runners").replaceChildren(frag);
  }

  function startPoll() {
    if (poll || document.hidden) return;
    poll = setInterval(refreshBoard, POLL_MS);
  }
  function stopPoll() { if (poll) { clearInterval(poll); poll = null; } }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopPoll();
    else if (!el("quiz").hidden && board && board.live) refreshBoard();
  });

  function renderLiveDot() { el("liveDot").hidden = !(current && current.live_run); }

  el("quizBtn").addEventListener("click", openQuiz);
  el("quizClose").addEventListener("click", closeQuiz);
  el("quizNew").addEventListener("click", showPick);

  el("quizStop").addEventListener("click", function () {
    if (!confirm("Baigti testą? Neatsakyti klausimai liks neatsakyti.")) return;
    rpc("teacher_run_stop", { p_token: token, p_run: board.id }).then(refreshBoard).catch(quizFail);
  });

  el("quizCsv").addEventListener("click", function () {
    var full = {};
    quizClass.students.forEach(function (s) { full[s.id] = s.full_name; });
    var lines = [["Mokinys", "Teisingi", "Iš", "Pažymys", "Atsakyta", "Vid. s"].join(";")];
    board.students.forEach(function (r) {
      lines.push(['"' + (full[r.id] || "").replace(/"/g, '""') + '"', r.correct, board.n,
        gradeFor(r.correct, board.n), r.answered, r.answered ? Math.round(r.avg_ms / 1000) : ""].join(";"));
    });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = quizClass.name + "-" + board.title + "-" + board.started_at.slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------- PINs ---------- */

  var shownPins = {};          // student id -> PIN, only while the sheet is open

  function openPins() {
    shownPins = {};
    el("pinsError").hidden = true;
    el("pinsTitle").textContent = "PIN kodai: " + current.name;
    renderPins();
    openFull(el("pins"));
  }

  function pinsFail(err) {
    if (err && err.code === "teacher_denied") { el("pins").hidden = true; return signOut(); }
    el("pinsError").textContent = err.message;
    el("pinsError").hidden = false;
  }

  function renderPins() {
    el("pinsIssue").hidden = current.students.every(function (s) { return s.has_pin; });
    var frag = document.createDocumentFragment();
    current.students.forEach(function (s) {
      var row = document.createElement("div");
      row.className = "pin-row" + (shownPins[s.id] ? " fresh" : "");
      var name = document.createElement("span");
      name.textContent = s.full_name;
      var pin = document.createElement("span");
      pin.className = "pin";
      pin.textContent = shownPins[s.id] || (s.has_pin ? "•••••" : "nėra");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tool dim";
      b.textContent = s.has_pin ? "Naujas" : "Sukurti";
      b.addEventListener("click", function () {
        if (s.has_pin && !confirm(s.full_name + ": senas PIN nebeveiks. Tęsti?")) return;
        rpc("teacher_pin_reset", { p_token: token, p_student: s.id }).then(function (p) {
          shownPins[s.id] = p;
          s.has_pin = true;
          renderPins();
        }).catch(pinsFail);
      });
      row.append(name, pin, b);
      frag.appendChild(row);
    });
    el("pinList").replaceChildren(frag);
  }

  el("pinsBtn").addEventListener("click", openPins);
  el("pinsClose").addEventListener("click", function () { shownPins = {}; closeFull(el("pins")); });
  el("pinsPrint").addEventListener("click", function () { window.print(); });
  el("pinsIssue").addEventListener("click", function () {
    el("pinsIssue").disabled = true;
    rpc("teacher_pins_issue", { p_token: token, p_class: current.id }).then(function (list) {
      list.forEach(function (p) { shownPins[p.id] = p.pin; });
      current.students.forEach(function (s) { if (shownPins[s.id]) s.has_pin = true; });
      renderPins();
    }).catch(pinsFail).then(function () { el("pinsIssue").disabled = false; });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!el("quiz").hidden) return closeQuiz();
    if (!el("pins").hidden) return el("pinsClose").click();
    if (!el("lessons").hidden) return el("lessonsClose").click();
    if (!el("display").hidden) el("displayClose").click();
    else if (!el("wheel").hidden) el("wheelClose").click();
  });

  /* ---------- boot ---------- */

  token = load(TOKEN_KEY);
  if (token) boot();
  else { el("gate").hidden = false; el("passcode").focus(); }
})();
</script>
</body>
</html>
